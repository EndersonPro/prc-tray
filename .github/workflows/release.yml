name: Build & Package

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: PRC-Tray-macos.dmg
            build_cmd: bash installers/install-macos.sh --non-interactive
          - os: ubuntu-latest
            artifact: PRC-Tray-linux-amd64.deb
            build_cmd: bash installers/install-linux.sh --deb
          - os: windows-latest
            artifact: PRC-Tray-windows-setup.exe
            build_cmd: iscc /DMyAppVersion=$env:PRC_TRAY_VERSION installers/install-windows.iss

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.os }})

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      - name: Generate build version
        shell: bash
        run: echo '__version__ = "${{ steps.version.outputs.value }}"' > _build_version.py

      - name: Build with PyInstaller
        env:
          PRC_TRAY_VERSION: ${{ steps.version.outputs.value }}
        run: uv run python -m PyInstaller daemon.spec --noconfirm --clean

      # ── Sign Windows binary via SignPath ──
      - name: Upload unsigned binary (Windows)
        if: runner.os == 'Windows'
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-prc-tray-exe
          path: dist/prc-tray.exe

      - name: Sign binary with SignPath (Windows)
        if: runner.os == 'Windows'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ secrets.SIGNPATH_ORG_ID }}'
          project-slug: 'prc-tray'
          signing-policy-slug: 'release'
          github-artifact-id: '${{ steps.upload-unsigned.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'dist'

      - name: Install create-dmg (macOS only)
        if: runner.os == 'macOS'
        run: brew install create-dmg

      - name: Install Inno Setup (Windows only)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install innosetup -y
          $isccPaths = @(
            "C:\Program Files (x86)\Inno Setup 6",
            "C:\Program Files\Inno Setup 6"
          )
          foreach ($p in $isccPaths) {
            if (Test-Path "$p\ISCC.exe") {
              echo $p >> $env:GITHUB_PATH
              break
            }
          }

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY || '-' }}
          PRC_TRAY_VERSION: ${{ steps.version.outputs.value }}
        run: ${{ matrix.build_cmd }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY || '-' }}
          PRC_TRAY_VERSION: ${{ steps.version.outputs.value }}
        run: ${{ matrix.build_cmd }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PRC-Tray-${{ steps.version.outputs.value }}-${{ matrix.os }}
          path: |
            installers/PRC-Tray-${{ steps.version.outputs.value }}-*.dmg
            installers/PRC-Tray-${{ steps.version.outputs.value }}-*.deb
            installers/output/PRC-Tray-${{ steps.version.outputs.value }}-*.exe
          if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Extract version from tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
